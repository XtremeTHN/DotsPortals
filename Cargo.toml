[package]
name = "dots-portals"
version = "0.1.0"
edition = "2024"

[dependencies]
ashpd = { version = "0.13.13", features = ["backend", "wallpaper", "usb", "screenshot", "tracing"] }
async-trait = "0.1.92"
gio = "0.22.10"
gio-unix = "0.22.8"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["process", "macros"] }
tracing = { version = "0.1.44" }
tracing-journald = "0.3.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-tree = "0.4.1"
zbus = "5.19.0"
